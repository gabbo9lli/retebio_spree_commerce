# Production & AWS Low-Cost Deployment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    container_name: retebio_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - retebio_net
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "4000"]
    ports: []
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/retebio_production
      REDIS_URL: redis://redis:6379/0
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-amazon}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_BUCKET: ${AWS_BUCKET:-retebio-media-prod}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: []
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000

volumes:
  caddy_data:
  caddy_config:
