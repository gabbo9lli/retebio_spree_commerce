# Production & AWS Low-Cost Deployment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    container_name: retebio_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - retebio_net
    depends_on:
      - backend
      - frontend

  postgres:
    environment:
      POSTGRES_DB: retebio_production

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "4000"]
    ports: []
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/retebio_production
      REDIS_URL: redis://redis:6379/0
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-amazon}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-${AWS_BUCKET:-retebio-media-prod}}
      AWS_BUCKET: ${AWS_S3_BUCKET:-${AWS_BUCKET:-retebio-media-prod}}
      API_DOMAIN: ${API_DOMAIN:-api.108.131.172.48.nip.io}
      SPREE_STORE_URL: ${SPREE_STORE_URL:-${API_DOMAIN:-api.108.131.172.48.nip.io}}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retebio_frontend
    command: ./docker-entrypoint.sh
    ports: []
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
      BACKEND_URL: http://backend:4000
      ASSETS_URL: https://${API_DOMAIN:-api.108.131.172.48.nip.io}
      BASE_URL: https://${STORE_DOMAIN:-store.108.131.172.48.nip.io}
      STORE_DOMAIN: ${STORE_DOMAIN:-store.108.131.172.48.nip.io}

volumes:
  caddy_data:
  caddy_config:
